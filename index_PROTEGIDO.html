    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; background-color: #0b0f19; color: #ffffff; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; }
        .slide-container { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; width: 100%; height: 100%; overflow: hidden; background-color: #0b0f19; }
        .slide-wrapper { position: relative; width: 100%; height: 100%; max-width: 100vw; max-height: 100vh; aspect-ratio: 16 / 9; display: flex; justify-content: center; align-items: center; }
        @keyframes zoomEntrada {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animar-zoom { animation: zoomEntrada 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .slide-img { width: 100%; height: 100%; object-fit: fill; display: block; position: absolute; top: 0; left: 0; }
        .capa-fullscreen { width: 100% !important; height: 100% !important; object-fit: fill !important; position: absolute !important; top: 0 !important; left: 0 !important; }
        .text-overlay { position: absolute; display: block; pointer-events: none; }
        .hotspot { position: absolute; cursor: pointer; background: rgba(0, 102, 204, 0.0); border-radius: 4px; transition: background 0.2s; z-index: 10; }
        .hotspot:hover { background: rgba(0, 102, 204, 0.15); }
        .nav-bar { display: none; width: 100%; justify-content: space-between; align-items: center; padding: 8px 12px; background: rgba(15, 23, 42, 0.98); border-top: 1px solid rgba(255,255,255,0.1); gap: 6px; flex-shrink: 0; z-index: 100; }
        .nav-bar.ativo { display: flex; }
        .btn { background: #0066cc; color: white; border: none; padding: 8px 12px; font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer; box-shadow: 0 4px 12px rgba(0,102,204,0.4); flex: 1; text-align: center; }
        .btn:active { transform: scale(0.96); }
        .counter { font-size: 13px; font-weight: bold; color: #94a3b8; min-width: 55px; text-align: center; flex-shrink: 0; }
    </style>
</head>

        function adicionarTexto(item, animar) {
            const el = document.createElement('img');
            el.src = item.file;
            el.className = animar ? 'text-overlay animar-zoom' : 'text-overlay';
            el.style.top = item.top;
            el.style.left = item.left;
            el.style.width = item.width;
            el.style.height = item.height;
            textOverlayLayer.appendChild(el);
        }
        function renderHotspots(slideNum) {
            hotspotLayer.innerHTML = '';
            if (indexLinks[slideNum]) {

                    div.className = 'hotspot';
                    div.style.top = link.top;
                    div.style.left = link.left;
                    div.style.width = link.width;
                    div.style.height = link.height;
                    div.onclick = (e) => {
                        e.stopPropagation();
                        irParaSlide(link.target);
                    };
                    hotspotLayer.appendChild(div);
                });
            }
        }
        function processarOrdemSlide(slideNum) {
            textOverlayLayer.innerHTML = '';
            limparTimers();
            narration.onended = null;
            narration.pause();
            narration.currentTime = 0;
            
            const itens = slideTextos[slideNum] || [];
            const itensTop = itens.filter(item => item.isTop);
            const itensBottom = itens.filter(item => !item.isTop);
            const temAudio = Boolean(audioMap[slideNum]);
            
            if (temAudio) {
                bgm.pause();
            } else {
                if (bgm.paused) { bgm.play().catch(e => {}); }
            }
            
            if (slideNum === 60) {
                activeTimeouts.push(setTimeout(() => {
                    itens.forEach(item => adicionarTexto(item, true));
                    if (temAudio) {
                        setTimeout(() => {
                            narration.src = audioMap[slideNum];
                            narration.load();
                            narration.play().catch(e => {});
                        }, 400);
                    }
                }, intervaloMs));
                return;
            }
            
            if (itensTop.length > 0) {
                activeTimeouts.push(setTimeout(() => {
                    itensTop.forEach(item => adicionarTexto(item, true));
                    if (temAudio) {
                        narration.src = audioMap[slideNum];
                        narration.load();
                        narration.play().catch(e => {});
                    }
                }, intervaloMs));
            } else if (temAudio) {
                activeTimeouts.push(setTimeout(() => {
                    narration.src = audioMap[slideNum];
                    narration.load();
                    narration.play().catch(e => {});
                }, intervaloMs));
            }
            
            if (itensBottom.length > 0) {
                if (itensTop.length > 0) {
                    activeTimeouts.push(setTimeout(() => {
                        itensBottom.forEach(item => adicionarTexto(item, false));
                    }, intervaloMs + 3000));
                } else {
                    activeTimeouts.push(setTimeout(() => {
                        itensBottom.forEach(item => adicionarTexto(item, false));
                    }, intervaloMs));
                }
            }
        }

                    processarOrdemSlide(currentSlide);
                }
                
                navBar.classList.add('ativo');
                counterElement.innerText = currentSlide + " / " + totalSlides;
                renderHotspots(currentSlide);
                
                if (currentSlide === totalSlides) {
                    btnAvancar.style.display = "none";
                } else {
                    btnAvancar.style.display = "block";
                }
            }
        }
        function tratarCliqueCapa() {
            if (currentSlide === 0) {
                bgm.play().then(() => { bgm.pause(); bgm.currentTime = 0; }).catch(e => {});
                narration.play().then(() => { narration.pause(); narration.currentTime = 0; }).catch(e => {});
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(err => {});
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen();
                }
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(err => {});
                }
                currentSlide = 1;
                atualizarSlide();
            }
        }
        function irParaSlide(num) {
            currentSlide = num;
            if (currentSlide < 1) currentSlide = 1;
            if (currentSlide > totalSlides) currentSlide = totalSlides;
            atualizarSlide();
        }
        function mudarSlide(direcao) {
            irParaSlide(currentSlide + direcao);
        }
        function voltarInicio() {
            irParaSlide(1);
        }
        let touchStartX = 0;
        const swipeArea = document.getElementById('swipeArea');
        swipeArea.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        });
        swipeArea.addEventListener('touchend', e => {
            const touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 50) {
                if (currentSlide === 0) { tratarCliqueCapa(); }
                else { mudarSlide(1); }
            }
            if (touchEndX - touchStartX > 50) {
                if (currentSlide > 1) { mudarSlide(-1); }
                else if (currentSlide === 1) { currentSlide = 0; atualizarSlide(); }
            }
        });
    </script>
</body>
</html>
